name: vinhcommand_desktop
description: "VinhCommand - AI Agent Command Center for Windows"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.1.1

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # System Integration
  ffi: ^2.1.2
  win32: ^5.5.1
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0

  # Process & Shell
  process_run: ^1.2.1

  # File System
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  watcher: ^1.1.0

  # Network & WebSocket
  http: ^1.2.1
  web_socket_channel: ^2.4.5
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^1.0.4

  # Crypto & Security
  encrypt: ^5.0.3
  pointycastle: ^3.8.0
  crypto: ^3.0.3

  # Serialization
  uuid: ^3.0.7

  # Logging
  logger: ^2.4.0

  # Utils
  intl: ^0.19.0
  collection: ^1.18.0
  async: ^2.11.0

  # Code Editor
  highlight: ^0.7.0

  # Image & Screen
  screenshot: ^2.3.0
  image: ^4.2.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # System Tray
  system_tray: ^2.0.3

  # Clipboard
  clipboard: ^0.1.3

  # URL Launcher
  url_launcher: ^6.2.6

  # QR Code
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true


