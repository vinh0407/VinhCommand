[package]
name = "vinhcommand"
version = "1.0.0"
description = "VinhCommand - Cross-platform IDE"
authors = ["VinhCommand Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "macros",
    "dialog",
    "fs",
    "shell",
    "process",
    "opener",
    "clipboard-manager",
    "http",
    "websocket",
    "notification",
    "global-shortcut",
    "updater",
] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"