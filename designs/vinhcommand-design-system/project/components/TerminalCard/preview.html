<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; background: #121417; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; }
  .card {
    width: 480px;
    background: #1B1E23;
    border: 1px solid #2D3139;
    border-radius: 6px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
  }
  .info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    background: rgba(74, 222, 128, 0.15);
    color: #4ADE80;
  }
  .runner-name {
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 13px;
    font-weight: 600;
    color: #E2E4E9;
  }
  .meta {
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 11px;
    color: #9EA4B0;
  }
  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-cmd { background: transparent; color: #4ADE80; border-color: #4ADE80; }
  .btn-bg { background: #2E7D32; color: #FFFFFF; }
</style>
</head>
<body>
  <div class="card">
    <div class="info">
      <div class="title-row">
        <span class="badge">[RUN]</span>
        <span class="runner-name">npm run dev</span>
      </div>
      <div class="meta">vite --host 0.0.0.0 · Port: 5173</div>
    </div>
    <div class="actions">
      <button class="btn btn-cmd">[Mở CMD]</button>
      <button class="btn btn-bg">[Chạy nền]</button>
    </div>
  </div>
</body>
</html>
