<!-- @dsCard group="Badges" height=80 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: #121417; font-family: "JetBrains Mono", Consolas, monospace; display: flex; gap: 10px; align-items: center; justify-content: center; }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .b-run { background: rgba(74, 222, 128, 0.15); color: #4ADE80; border: 1px solid rgba(74, 222, 128, 0.4); }
  .b-ok { background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.4); }
  .b-dir { background: rgba(220, 220, 170, 0.12); color: #DCDCAA; border: 1px solid rgba(220, 220, 170, 0.3); }
  .b-file { background: rgba(158, 164, 176, 0.12); color: #9EA4B0; border: 1px solid rgba(158, 164, 176, 0.3); }
  .b-cmd { background: rgba(250, 204, 21, 0.15); color: #FACC15; border: 1px solid rgba(250, 204, 21, 0.4); }
</style>
</head>
<body>
  <span class="badge b-run">[RUN]</span>
  <span class="badge b-ok">[OK]</span>
  <span class="badge b-dir">[DIR]</span>
  <span class="badge b-file">[FILE]</span>
  <span class="badge b-cmd">[CMD]</span>
</body>
</html>
